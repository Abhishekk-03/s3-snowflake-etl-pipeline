name: Spark ETL CI-CD


on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  installation:
    name: Deploy Lambda and Glue to AWS
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Get Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install libraries
        run: pip install -r requirements.txt

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Package Python modules
      - name: Create Dependencies ZIP
        run: |
          zip -r dependencies.zip jobs utils \
          -x "*__pycache__*" "*.pyc"

      # 4. Upload ZIP to S3
      - name: Upload Dependencies
        run: |
          aws s3 cp dependencies.zip \
          s3://scripts-obj/csv-parquet-glue/dependencies.zip

      # 5. Upload Main Glue Script
      - name: Upload Glue Script
        run: |
          aws s3 cp main.py \
          s3://scripts-obj/csv-parquet-glue/main.py

      # 6. Deployment Status
      - name: Deployment Successful
        run: echo "Glue project deployed successfully!"